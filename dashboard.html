.confirm-summary>div{padding:10px 13px;display:grid;grid-template-columns:82px minmax(0,1fr);gap:10px;font-size:11px}
.confirm-summary>div+div{border-top:1px solid var(--line)}
.confirm-summary dt{margin:0;color:#919aae;font-size:10px}
.confirm-summary dd{margin:0;font-weight:700;overflow-wrap:anywhere}

.confirm-actions .confirm-accept:hover{filter:brightness(.96)}
.toast-stack{position:fixed;right:24px;bottom:24px;z-index:100;display:flex;flex-direction:column;gap:10px;width:min(390px,calc(100vw - 32px));pointer-events:none}
.notice{--notice-tone:#6c5bd1;--notice-soft:#efecff;--notice-duration:5500ms;position:relative;display:flex;align-items:flex-start;gap:12px;padding:15px 13px 18px 16px;border:1px solid #e7ebf3;border-radius:16px;background:#fff;color:var(--ink);box-shadow:0 14px 44px #19243d18;overflow:hidden;pointer-events:auto;animation:notice-in .3s cubic-bezier(.22,1,.36,1)}
.notice[data-kind=success]{--notice-tone:#299678;--notice-soft:#e7f7ef}
.notice[data-kind=error]{--notice-tone:#cd5470;--notice-soft:#fff0f3}
.notice[data-kind=warning]{--notice-tone:#b58936;--notice-soft:#fff5e2}
.notice-symbol{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:11px;background:var(--notice-soft);color:var(--notice-tone)}
.notice-symbol svg{width:18px;height:18px}
.notice[data-kind=success] .notice-symbol path{stroke-dasharray:30;stroke-dashoffset:30;animation:check-draw .45s .1s ease-out forwards}
.notice-copy{min-width:0;flex:1;padding-top:1px}
.notice-copy strong{display:block;font-size:12px;margin-bottom:3px}
.notice-copy p{font-size:11px;color:#8790a4;line-height:1.6;overflow-wrap:anywhere;white-space:pre-line}
.notice-close{width:23px;height:23px;margin-top:1px}
.notice-progress{position:absolute;height:3px;bottom:0;left:0;width:100%;transform-origin:left;background:var(--notice-tone);opacity:.65;animation:notice-life var(--notice-duration) linear forwards}
.notice:hover .notice-progress,.notice:focus-within .notice-progress{animation-play-state:paused}

  if(!Object.hasOwn(titles,kind))kind='info';
  const notice=document.createElement('section'),duration=kind==='error'?8000:5500;
  notice.className='notice';notice.dataset.kind=kind;notice.setAttribute('role',kind==='error'?'alert':'status');notice.style.setProperty('--notice-duration',duration+'ms');
  notice.innerHTML=`<span class="notice-symbol">${kind==='loading'?'<span class="feedback-spinner" aria-hidden="true"></span>':feedbackIcon(kind==='success'?'check':kind==='error'?'close':kind==='warning'?'warning':'info')}</span><div class="notice-copy"><strong>${esc(options.title||titles[kind])}</strong><p>${esc(message)}</p></div>${kind==='loading'?'':`<button type="button" class="notice-close" aria-label="Tutup notifikasi">${feedbackIcon('close')}</button><span class="notice-progress" aria-hidden="true"></span>`}`;

function goBack(){if(busy)return;if($('#modal-form')){closeModal();return}const previous=routeTrail.pop()||(eventId?(tab==='overview'?'events':'event/'+encodeURIComponent(eventId)):'dashboard');if(previous===currentRoute){syncBackButton();return}backNavigation=true;closeSidebar();location.hash=previous;window.scrollTo(0,0)}
function syncBackButton(){const button=$('#page-back');if(!button)return;button.disabled=busy||(!routeTrail.length&&!eventId&&view==='dashboard');button.title=routeTrail.length?'Kembali ke halaman sebelumnya':eventId?(tab==='overview'?'Kembali ke daftar acara':'Kembali ke ringkasan acara'):'Kembali ke Dashboard'}
function readRoute(){let route=location.hash.slice(1)||'dashboard';if(route.startsWith('event/')){const parts=route.split('/');try{eventId=decodeURIComponent(parts[1]||'')}catch{eventId=null}view='events';tab=Object.hasOwn(detailTabNames,parts[2])?parts[2]:'overview';if(!eventBy(eventId)){eventId=null;route='events';history.replaceState(null,'','#events')}}else{eventId=null;view=['dashboard','events','calendar','staff','honor','reports','settings'].includes(route)?route:'dashboard';route=view}if(currentRoute&&currentRoute!==route){if(backNavigation)backNavigation=false;else if(routeTrail.at(-1)===route)routeTrail.pop();else{routeTrail.push(currentRoute);if(routeTrail.length>60)routeTrail.shift()}}else backNavigation=false;currentRoute=route;render()}
function render(){if(!$('#sidebar'))return;disposeLetterPreview();if(eventId&&!eventBy(eventId)){eventId=null;view='events'}document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#event-count').textContent=db.events.length||'';const names={dashboard:'Dashboard',events:'Acara',calendar:'Kalender',staff:'Petugas',honor:'Honor',reports:'Laporan & Arsip',settings:'Pengaturan'};$('#crumb').textContent='Ruang Acara / '+(eventId?detailTabNames[tab]:names[view]);$('#content').innerHTML=eventId?detailPage(eventBy(eventId)):({dashboard:dashboardPage,events:eventsPage,calendar:calendarPage,staff:staffPage,honor:honorPage,reports:reportsPage,settings:settingsPage}[view])();syncBackButton();hydrateQr();if(eventId&&tab==='letter')refreshLetterPreview(eventId)}
function setTab(next){if(eventId&&Object.hasOwn(detailTabNames,next))go('events',eventId,next)}
window.addEventListener('hashchange',readRoute);window.addEventListener('resize',syncSidebar);document.addEventListener('keydown',e=>{if(confirmState)return;if(e.key==='Escape'){e.preventDefault();closeSidebar();closeModal()}else if(e.key==='Tab'&&$('#modal-form')){const items=[...document.querySelectorAll('.modal button:not(:disabled),.modal input:not(:disabled),.modal select:not(:disabled),.modal textarea:not(:disabled),.modal a[href]')].filter(el=>el.getClientRects().length);if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function eventButton(id,label='Lihat',style='sm'){return btn(label,call('go','events',id),style)}
function dashboardPage(){const t=today(),reports=db.events.filter(e=>e.status==='done'&&e.reportStatus!=='final'),upcoming=db.events.filter(e=>e.status!=='cancelled'&&e.endDate>=t).sort((a,b)=>a.startDate.localeCompare(b.startDate)).slice(0,6);let remaining=0;for(const e of db.events)for(const p of people(e.id))remaining+=Math.max(0,due(e.id,p)-paid(e.id,p));const stats=[[db.events.filter(e=>e.status!=='cancelled'&&e.startDate<=t&&e.endDate>=t).length,'Acara hari ini','calendar'],[db.events.filter(e=>e.status!=='cancelled'&&e.startDate>t).length,'Acara mendatang','events'],[reports.length,'Laporan tertunda','file'],[money(remaining),'Sisa honor','money']];const follow=db.events.filter(e=>e.status==='done'&&(e.reportStatus!=='final'||e.photo&&e.photoStatus!=='complete'||(!e.live||e.archiveStream)&&e.recordStatus!=='available'));return title('Dashboard','Pantau kegiatan, tim, dan pekerjaan yang masih menunggu.',btn('+ Acara baru','openEventForm()','primary'))+`<section class="hero"><div class="eyebrow">RUANG KERJA TERPADU</div><h2>Satu tempat untuk setiap momen penting.</h2><p>Rapikan jadwal, siapkan surat tugas, dan tuntaskan dokumentasi kegiatan tim.</p>${btn('Buat acara baru →','openEventForm()')}</section><div class="kpis">${stats.map(([n,l,i])=>`<div class="card kpi"><i>${icon(i)}</i><strong style="${i==='money'?'font-size:20px':''}">${esc(n)}</strong><p>${l}</p></div>`).join('')}</div><div class="grid two-col"><div class="card pad"><div class="card-head"><div><h2>Jadwal terdekat</h2><p>Kegiatan yang sedang dan akan berlangsung.</p></div>${btn('Kalender',call('go','calendar'),'sm')}</div>${upcoming.map(e=>`<div class="event-item" onclick="${esc(call('go','events',e.id))}"><div class="datebox"><b>${esc(e.startDate.slice(8))}</b><small>${new Intl.DateTimeFormat('id-ID',{month:'short'}).format(new Date(e.startDate+'T12:00:00'))}</small></div><div><h3>${esc(e.title)}</h3><span class="sub">${esc(e.organizer)} · ${sessions(e.id).length} sesi</span></div>${badge(statuses[e.status],e.status)}</div>`).join('')||'<div class="empty">Belum ada jadwal mendatang.</div>'}</div><div class="card pad"><h2>Perlu ditindaklanjuti</h2>${follow.slice(0,6).map(e=>`<div class="progress-row"><div><strong>${esc(e.title)}</strong><span class="sub">${esc([e.reportStatus!=='final'?'Laporan belum final':'',e.photo&&e.photoStatus!=='complete'?'Foto belum lengkap':'',(!e.live||e.archiveStream)&&e.recordStatus!=='available'?'Rekaman belum tersedia':''].filter(Boolean).join(' · '))}</span></div>${eventButton(e.id)}</div>`).join('')||'<div class="success">Seluruh tindak lanjut sudah tertangani.</div>'}</div></div>`}
function filteredEvents(){const q=filters.q.toLowerCase();return db.events.filter(e=>{const text=[e.title,e.organizer,e.pic,...sessions(e.id).map(s=>[s.venues,s.address,s.area].join(' ')),...tasks(e.id).map(a=>staffBy(a.staffId)?.name)].join(' ').toLowerCase();return(!q||text.includes(q))&&(filters.status==='all'||e.status===filters.status)&&(filters.format==='all'||e.format===filters.format)&&(filters.staff==='all'||tasks(e.id).some(a=>a.staffId===filters.staff))&&(!filters.from||e.endDate>=filters.from)&&(!filters.to||e.startDate<=filters.to)}).sort((a,b)=>b.startDate.localeCompare(a.startDate))}
const options=(items,value)=>items.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('');
function filtersMarkup(){return `<div class="card filterbar"><div><label for="event-search">PENCARIAN</label><input id="event-search" class="input" placeholder="Nama, PIC, lokasi…" value="${esc(filters.q)}" oninput="changeFilter('q',this.value)"></div><div><label>STATUS</label><select class="select" onchange="changeFilter('status',this.value)">${options([['all','Semua status'],...Object.entries(statuses)],filters.status)}</select></div><div><label>FORMAT</label><select class="select" onchange="changeFilter('format',this.value)">${options([['all','Semua format'],...Object.entries(formats)],filters.format)}</select></div><div><label>PETUGAS</label><select class="select" onchange="changeFilter('staff',this.value)">${options([['all','Semua petugas'],...db.staff.map(p=>[p.id,p.name])],filters.staff)}</select></div><div><label>DARI TANGGAL</label><input class="input" type="date" value="${esc(filters.from)}" onchange="changeFilter('from',this.value)"></div><div><label>SAMPAI TANGGAL</label><input class="input" type="date" value="${esc(filters.to)}" onchange="changeFilter('to',this.value)"></div></div>`}
function changeFilter(key,value){filters[key]=value;page=1;if(view==='calendar')$('#calendar-box').innerHTML=calendarMarkup();else updateEventList()}
function eventsPage(){return title('Semua acara',db.events.length+' acara tercatat · 10 acara per halaman.',btn('Kalender',call('go','calendar'))+btn('+ Tambah acara','openEventForm()','primary'))+filtersMarkup()+'<div class="card" id="events-list">'+eventListMarkup()+'</div>'}
function eventListMarkup(){const all=filteredEvents(),pages=Math.max(1,Math.ceil(all.length/10));page=Math.max(1,Math.min(page,pages));const start=(page-1)*10,rows=all.slice(start,start+10).map(e=>`<tr><td>${esc(e.title)}<span class="sub">${esc(e.organizer)}</span></td><td>${esc(fmt(e.startDate))}${e.endDate!==e.startDate?'<span class="sub">s.d. '+esc(fmt(e.endDate))+'</span>':''}</td><td>${esc(formats[e.format])}</td><td>${people(e.id).length} petugas</td><td>${badge(statuses[e.status],e.status)}</td><td><div class="btnrow">${eventButton(e.id)}${admin()?btn('Hapus',call('removeRecord','events',e.id),'sm danger'):''}</div></td></tr>`).join('');return table(['Acara','Jadwal','Format','Tim','Status','Tindakan'],rows)+(all.length?`<div class="pagination"><span>Menampilkan ${start+1}–${Math.min(start+10,all.length)} dari ${all.length} acara</span><div class="btnrow">${btn('← Sebelumnya',call('changePage',page-1),'sm',page===1)}<span>Halaman ${page} / ${pages}</span>${btn('Berikutnya →',call('changePage',page+1),'sm',page===pages)}</div></div>`:'')}
function updateEventList(){const root=$('#events-list');if(root)root.innerHTML=eventListMarkup()}
function changePage(p){page=p;updateEventList();$('#events-list')?.scrollIntoView({behavior:'smooth',block:'start'})}
function calendarPage(){return title('Kalender acara','Jadwal kegiatan per hari.',btn('+ Acara baru','openEventForm()','primary'))+filtersMarkup()+'<div class="card" id="calendar-box">'+calendarMarkup()+'</div>'}
function calendarMarkup(){const y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,list=filteredEvents(),stamp=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return `<div class="calendar-head"><h2>${new Intl.DateTimeFormat('id-ID',{month:'long',year:'numeric'}).format(first)}</h2><div class="btnrow">${btn('←','changeMonth(-1)','sm')}${btn('Hari ini','changeMonth(0)','sm')}${btn('→','changeMonth(1)','sm')}</div></div><div class="cal-grid">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<div class="cal-week">${x}</div>`).join('')}${Array.from({length:42},(_,i)=>{const d=new Date(y,m,1-offset+i),s=stamp(d),matches=list.filter(e=>e.startDate<=s&&e.endDate>=s);return `<div class="cal-day ${d.getMonth()!==m?'faded':''} ${s===today()?'today':''}"><b>${d.getDate()}</b>${matches.slice(0,3).map(e=>`<button class="cal-event" title="${esc(e.title)}" onclick="${esc(call('go','events',e.id))}">${esc(e.title)}</button>`).join('')}${matches.length>3?`<small>+${matches.length-3} acara</small>`:''}</div>`}).join('')}</div>`}
function changeMonth(step){cal=step?new Date(cal.getFullYear(),cal.getMonth()+step,1):new Date();$('#calendar-box').innerHTML=calendarMarkup()}
function staffPage(){const descriptions=[['Operator','Menjalankan materi presentasi, komputer acara, videotron, dan proyektor.'],['Kameramen','Menyorot MC, pemateri, peserta, dan momen penting. Gunakan Kameramen 1 dan 2 untuk dua posisi kamera.'],['Dokumentasi','Mengambil foto pembukaan, peserta, narasumber, interaksi, dan foto bersama.']];return title('Petugas',db.staff.length+' anggota tim terdaftar.',btn('+ Tambah petugas','openStaffForm()','primary'))+`<div class="role-grid">${descriptions.map(([h,p])=>`<div class="card pad"><h3>${h}</h3><p>${p}</p></div>`).join('')}</div><div class="grid staff-grid">${db.staff.map(p=>`<div class="card pad staff-card"><div class="staff-top"><span class="avatar">${esc(initials(p.name))}</span><div><h3>${esc(p.name)}</h3><span class="sub">NIM ${esc(p.nim)}</span></div></div><p class="small muted">${esc(p.roles||roles.filter(r=>!/[12]/.test(r)).join(' · '))}</p><div class="btnrow">${btn('Edit',call('openStaffForm',p.id),'sm')}${btn('Riwayat',call('staffHistory',p.id),'sm soft')}${btn('Hapus',call('removeRecord','staff',p.id),'sm danger')}</div></div>`).join('')||'<div class="card empty">Belum ada petugas.</div>'}</div>`}
function staffHistory(id){filters={q:'',status:'all',format:'all',staff:id,from:'',to:''};page=1;go('events')}
function honorRows(){return db.events.flatMap(e=>people(e.id).map(id=>({e,p:staffBy(id),id,total:due(e.id,id),received:paid(e.id,id)})))}
function honorPage(){const rows=honorRows(),total=rows.reduce((n,r)=>n+r.total,0),received=rows.reduce((n,r)=>n+r.received,0);return title('Honor petugas','Hak, pembayaran, dan sisa honor per acara.',admin()?btn('+ Catat pembayaran','openPaymentForm()','primary'):'')+`<div class="kpis" style="grid-template-columns:repeat(3,1fr)">${[[total,'Total honor'],[received,'Sudah dibayar'],[Math.max(0,total-received),'Sisa honor']].map(([n,l])=>`<div class="card kpi"><strong style="font-size:20px">${money(n)}</strong><p>${l}</p></div>`).join('')}</div><div class="card">${table(['Petugas','Acara','Total honor','Dibayar','Sisa','Status'],rows.map(r=>`<tr><td>${esc(r.p?.name||'Petugas tidak tersedia')}</td><td>${esc(r.e.title)}<div>${eventButton(r.e.id)}</div></td><td>${money(r.total)}</td><td>${money(r.received)}</td><td>${money(Math.max(0,r.total-r.received))}</td><td>${badge(paymentStatus(r.total,r.received),r.total>0&&r.received>=r.total?'paid':r.received?'partial':'missing')}</td></tr>`).join(''))}</div>`}
function reportsPage(){return title('Laporan & Arsip','Surat tugas, laporan hasil, dan dokumentasi per acara.')+`<div class="card">${table(['Acara','Foto','Rekaman','Laporan','Dokumen'],[...db.events].sort((a,b)=>b.startDate.localeCompare(a.startDate)).map(e=>`<tr><td>${esc(e.title)}<span class="sub">${esc(fmt(e.startDate))}</span></td><td>${e.photo?(e.photoUrl?'Tersedia':'Belum tersedia'):'Tidak digunakan'}</td><td>${e.live&&!e.archiveStream?'Tidak diarsipkan':e.recordUrl?'Tersedia':'Belum tersedia'}</td><td>${badge(e.reportStatus==='final'?'Final':e.reportStatus==='draft'?'Draf':'Belum dibuat',e.reportStatus)}</td><td><div class="btnrow">${btn('Surat tugas',call('openDetailTab',e.id,'letter'),'sm soft')}${btn('Laporan',call('openDetailTab',e.id,'report'),'sm')}${btn('Arsip',call('openDetailTab',e.id,'docs'),'sm')}</div></td></tr>`).join(''))}</div>`}

function detailPage(e){const tabs=[['overview','Ringkasan'],['schedule','Jadwal & lokasi'],['team','Penugasan'],['letter','Surat Tugas'],['docs','Dokumentasi & arsip'],['report','Laporan hasil'],['honor','Honor']];return title(e.title,e.organizer+' · '+dateLabel(e),btn('← Daftar acara',call('go','events'))+btn('Edit acara',call('openEventForm',e.id))+ (admin()?btn('Hapus',call('removeRecord','events',e.id),'danger'):''))+`<div class="tabs">${tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="${esc(call('setTab',id))}">${label}</button>`).join('')}</div>`+({overview:overviewDetail,schedule:scheduleDetail,team:teamDetail,letter:letterDetail,docs:docsDetail,report:reportDetail,honor:honorDetail}[tab]||overviewDetail)(e)}

function overviewDetail(e){const ids=people(e.id),settled=ids.filter(p=>due(e.id,p)>0&&paid(e.id,p)>=due(e.id,p)).length,number=String(e.phone||'').replace(/\D/g,'').replace(/^0/,'62');return `<div class="grid two-col"><div class="card pad"><div class="card-head"><h2>Informasi acara</h2>${badge(statuses[e.status],e.status)}</div><div class="info-grid">${info('Penyelenggara',e.organizer)}${info('PIC panitia',e.pic+(e.picRole?' · '+e.picRole:''))}${info('Tanggal',dateLabel(e))}${info('Format',formats[e.format])}${info('Kontak PIC',e.phone)}${info('Layanan',services(e))}${info('Jumlah sesi',sessions(e.id).length)}${info('Jumlah petugas',ids.length)}</div>${number?`<div class="btnrow" style="margin-top:20px"><a class="btn sm soft" href="https://wa.me/${number}" target="_blank" rel="noopener">WhatsApp PIC</a><a class="btn sm" href="tel:${number}">Telepon</a></div>`:''}${e.notes?'<p style="white-space:pre-wrap;margin-top:20px" class="small">'+esc(e.notes)+'</p>':''}</div><div class="card pad"><h2>Progres pekerjaan</h2>${[['Pelaksanaan',statuses[e.status]],['Dokumentasi foto',!e.photo?'Tidak digunakan':e.photoStatus==='complete'?'Lengkap':'Belum lengkap'],['Rekaman',e.live&&!e.archiveStream?'Tidak diarsipkan':e.recordStatus==='available'?'Tersedia':'Belum tersedia'],['Laporan',e.reportStatus==='final'?'Final':e.reportStatus==='draft'?'Draf':'Belum dibuat'],['Honor',settled+' dari '+ids.length+' petugas lunas']].map(([a,b])=>`<div class="progress-row"><span>${a}</span><strong>${b}</strong></div>`).join('')}<div class="btnrow" style="margin-top:18px">${btn('Buat surat tugas',call('setTab','letter'),'soft')}${btn('Laporan hasil',call('setTab','report'))}</div></div></div>`}
function overlaps(a,b){let start=s=>new Date(s.date+'T'+s.start),end=s=>{const d=new Date(s.date+'T'+s.end);if(d<=start(s))d.setDate(d.getDate()+1);return d};return start(a)<end(b)&&start(b)<end(a)}
function sessionWarnings(s){const venues=v=>String(v||'').split(',').map(t=>t.trim().toLowerCase()).filter(Boolean);return db.sessions.filter(o=>o.id!==s.id&&o.eventId!==s.eventId&&eventBy(o.eventId)?.status!=='cancelled'&&overlaps(s,o)).flatMap(o=>venues(s.venues).filter(v=>venues(o.venues).includes(v)).map(v=>'Lokasi '+v+' juga dipakai pada '+eventBy(o.eventId)?.title))}
function scheduleDetail(e){return `<div class="card pad"><div class="card-head"><div><h2>Jadwal per sesi</h2><p>Jam selesai ≤ jam mulai dianggap selesai pada hari berikutnya.</p></div>${btn('+ Tambah sesi',call('openSessionForm',e.id),'primary sm')}</div>${sessions(e.id).map(s=>`<section class="session-card"><div class="card-head"><div><h3>${esc(s.title)}</h3><span class="sub">${esc(fmt(s.date,true))} · ${esc(s.start)}–${esc(s.end)}${s.end<=s.start?' (+1 hari)':''}</span></div><div class="btnrow">${btn('Edit',call('openSessionForm',e.id,s.id),'sm')}${btn('Hapus',call('removeRecord','sessions',s.id),'sm danger')}</div></div><div class="session-details"><span class="pill">${esc(formats[s.format])}</span><span class="pill">${esc(s.venues||'Zoom')}</span>${s.area?'<span class="pill">'+esc(s.area+' · '+(s.venueType||''))+'</span>':''}<span class="pill">${tasks(e.id).filter(a=>a.sessionId===s.id).length} penugasan</span></div>${s.address?'<p class="small muted" style="margin-top:12px">'+esc(s.address)+'</p>':''}<div class="btnrow" style="margin-top:10px">${link('Buka Zoom',s.zoomLink)}${s.meetingId?'<span class="small muted">ID '+esc(s.meetingId)+' · '+esc(s.host||'')+'</span>':''}</div>${sessionWarnings(s).map(w=>'<div class="warning">'+esc(w)+'</div>').join('')}</section>`).join('')||'<div class="empty">Belum ada sesi kegiatan.</div>'}</div>`}
function teamDetail(e){return `<div class="card pad"><div class="card-head"><div><h2>Penugasan petugas</h2><p>Tambahkan beberapa petugas sekaligus, dengan peran dan sesi masing-masing.</p></div>${btn('+ Tambah petugas',call('openAssignments',e.id),'primary sm',!sessions(e.id).length||!db.staff.length)}</div>${table(['Petugas','Peran','Sesi','Lokasi','Honor','Tindakan'],tasks(e.id).map(a=>{const s=db.sessions.find(s=>s.id===a.sessionId);return `<tr><td>${esc(staffBy(a.staffId)?.name||'—')}</td><td>${esc(a.role)}</td><td>${esc(s?.title||'—')}<span class="sub">${esc(fmt(s?.date))}</span></td><td>${esc(a.venue||'—')}</td><td>${money(a.honor)}</td><td><div class="btnrow">${btn('Edit',call('editAssignment',a.id),'sm')}${btn('Hapus',call('removeRecord','assignments',a.id),'sm danger')}</div></td></tr>`}).join(''))}</div>`}

function letterMarkup(id){const d=letterData(id);return `<article class="report-paper letter"><header class="letterhead">${letterLogo()?`<img src="${letterLogo()}" alt="Logo UBP Karawang">`:''}<div><strong>UNIVERSITAS BUANA PERJUANGAN KARAWANG</strong><b>TERAKREDITASI BAN-PT DAN LAM-PTKes</b><small>Jl. H. S. Ronggowaluyo Telukjambe Timur Karawang 41361<br>Tel./Fax. (0267) 8403140<br>Site: http://ubpkarawang.ac.id · Email: info@ubpkarawang.ac.id</small></div></header><h2>Surat Tugas</h2><p>${esc(d.intro)}</p><table><thead><tr><th style="width:7%">No.</th><th style="width:35%">Nama</th><th style="width:25%">NIM</th><th style="width:33%">Tugas</th></tr></thead><tbody>${d.team.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${esc(p.nim)}</td><td>${esc(p.role)}</td></tr>`).join('')||'<tr><td colspan="4" class="letter-empty-row">Belum ada petugas ditugaskan.</td></tr>'}</tbody></table><p>${esc(d.purpose)}</p><table><thead><tr><th style="width:29%">Hari / Tanggal</th><th style="width:20%">Jam</th><th style="width:51%">Sesi / Tempat</th></tr></thead><tbody>${d.ss.map(s=>`<tr><td>${esc(letterDate(s.date,true))}</td><td>${esc(s.start+'–'+s.end+(s.end<=s.start?' (+1 hari)':''))}</td><td>${esc(s.title+' · '+(s.venues||'Zoom'))}</td></tr>`).join('')||'<tr><td colspan="3" class="letter-empty-row">Jadwal penugasan belum tersedia.</td></tr>'}</tbody></table><p>Surat tugas ini dibuat untuk dilaksanakan dengan penuh tanggung jawab.</p><div class="signature"><strong>Karawang, ${esc(letterDate(d.cfg.date))}<br>Kepala Sekretariat<br>Universitas Buana Perjuangan Karawang,<span class="signature-name">Yudi Firmansyah, S.Pd., M.Pd</span></strong></div><div class="ack">Tugas tersebut di atas sudah dilaksanakan<br>dan selesai dengan baik,</div></article>`}
document.addEventListener('change',e=>{if(['letterScope','letterPaper'].includes(e.target.name))updateLetter()});
function printLetter(id){readLetterOptions(id);if(!letterReadiness(id).ready)return notify('Lengkapi ringkasan, jadwal & lokasi, dan penugasan terlebih dahulu.');$('#print-page-style').textContent=`@page{size:${letterConfig(id).paper==='legal'?'legal':'A4'} portrait;margin:18mm}`;$('#print-root').innerHTML=letterMarkup(id);setTimeout(()=>window.print(),250)}
async function logoForPdf(){const src=letterLogo();if(!src)return null;const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('Logo surat gagal dimuat.'));i.src=src});const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;canvas.getContext('2d').drawImage(img,0,0);return canvas.toDataURL('image/png')}
async function downloadLetter(id){if(busy)return;readLetterOptions(id);try{const prepared=await prepareLetterPdf(id),e=eventBy(id),url=URL.createObjectURL(prepared.blob),anchor=document.createElement('a');anchor.href=url;anchor.download='Surat Tugas - '+e.title.replace(/[\\/:*?"<>|]/g,'-').slice(0,100)+'.pdf';document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notify('PDF surat tugas berhasil diunduh.','success')}catch(e){notify(e.message,'error')}}
function buildLetterPdf(d,logo){const pdf=new jspdf.jsPDF({unit:'mm',format:d.cfg.paper,compress:true}),W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight(),L=19,R=W-19,C=R-L;let y=0;const clean=s=>String(s??'').replace(/[–—]/g,'-').replace(/·/g,',').replace(/[‘’]/g,"'").replace(/[“”]/g,'"');const font=(size=12,weight='normal')=>{pdf.setFont('times',weight);pdf.setFontSize(size);pdf.setTextColor(0)};
 function header(){if(logo)pdf.addImage(logo,'PNG',L,13,23,23);font(13,'bold');pdf.text('UNIVERSITAS BUANA PERJUANGAN',L+27+(C-27)/2,17,{align:'center'});pdf.text('KARAWANG',L+27+(C-27)/2,22.5,{align:'center'});font(9,'bold');pdf.text('TERAKREDITASI BAN-PT DAN LAM-PTKes',L+27+(C-27)/2,27.5,{align:'center'});font(8);pdf.text('Jl. H. S. Ronggowaluyo Telukjambe Timur Karawang 41361',L+27+(C-27)/2,32,{align:'center'});pdf.text('Tel./Fax. (0267) 8403140 | ubpkarawang.ac.id | info@ubpkarawang.ac.id',L+27+(C-27)/2,36,{align:'center'});pdf.setDrawColor(0);pdf.setLineWidth(.5);pdf.line(L,40,R,40);y=48;}
 function room(height){if(y+height>H-20){pdf.addPage();header()}}
 function para(text,gap=4){font();const lines=pdf.splitTextToSize(clean(text),C);for(const line of lines){room(5.4);pdf.text(line,L,y);y+=5.4}y+=gap}
 function drawTable(heads,rows,widths){const lineH=4.3,pad=1.8;function draw(row,bold){font(10,bold?'bold':'normal');const cells=row.map((v,i)=>pdf.splitTextToSize(clean(v),C*widths[i]-pad*2)),height=Math.max(...cells.map(x=>x.length))*lineH+pad*2;let x=L;for(let i=0;i<cells.length;i++){const w=C*widths[i];if(bold){pdf.setFillColor(244);pdf.rect(x,y,w,height,'F')}pdf.setDrawColor(180);pdf.setLineWidth(.2);pdf.rect(x,y,w,height);pdf.text(cells[i],x+pad,y+pad+3.3,{lineHeightFactor:1.22});x+=w}y+=height;return height}room(20);draw(heads,true);for(const row of rows){font(10);const h=Math.max(...row.map((v,i)=>pdf.splitTextToSize(clean(v),C*widths[i]-pad*2).length))*lineH+pad*2;if(y+h>H-20){pdf.addPage();header();draw(heads,true)}draw(row,false)}y+=5}
 header();font(14,'bold');pdf.text('Surat Tugas',W/2,y,{align:'center'});pdf.setLineWidth(.25);pdf.setDrawColor(0);pdf.line(W/2-12,y+1,W/2+12,y+1);y+=12;para(d.intro);drawTable(['No.','Nama','NIM','Tugas'],d.team.map((p,i)=>[String(i+1),p.name,p.nim,p.role]),[.06,.36,.25,.33]);para(d.purpose);drawTable(['Hari / Tanggal','Jam','Sesi / Tempat'],d.ss.map(s=>[fmt(s.date,true),s.start+'-'+s.end+(s.end<=s.start?' (+1 hari)':''),s.title+'; '+(s.venues||'Zoom')]),[.29,.20,.51]);para('Surat tugas ini dibuat untuk dilaksanakan dengan penuh tanggung jawab.',8);room(72);font(12,'bold');const x=L+C*.46;pdf.text('Karawang, '+fmt(d.cfg.date),x,y);pdf.text('Kepala Sekretariat',x,y+6);pdf.text('Universitas Buana Perjuangan Karawang,',x,y+12);const name='Yudi Firmansyah, S.Pd., M.Pd';pdf.text(name,x,y+41);pdf.setDrawColor(0);pdf.line(x,y+42,x+pdf.getTextWidth(name),y+42);y+=63;font();pdf.text('Tugas tersebut di atas sudah dilaksanakan',L,y);pdf.text('dan selesai dengan baik,',L,y+6);pdf.setProperties({title:'Surat Tugas - '+clean(d.e.title),author:'BOC UBP Karawang',subject:'Penugasan petugas kegiatan'});return pdf}
document.addEventListener('DOMContentLoaded',boot);
