		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}

			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);

			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}

					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);

		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}

			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

    function staffPage(){let list=db.staff.filter(x=>!query||[x.name,x.nim,x.roles,x.email].join(' ').toLowerCase().includes(query.toLowerCase()));return `${header('DIREKTORI TIM','Petugas',`${db.staff.length} anggota tim siap ditugaskan dalam acara.`,`<button class="btn primary" onclick="openStaffForm()">${icon('plus')} Tambah petugas</button>`)}<div class="card pad" style="margin-bottom:20px"><div class="card-head"><div><h2>Pembagian peran</h2><p>Peran dipilih untuk setiap sesi sehingga orang yang sama dapat menerima tugas berbeda pada acara lain.</p></div></div><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:12px"><div class="mini-stat" style="display:block"><strong style="font-size:13px">Operator</strong><p class="small muted" style="margin-top:6px">Menjalankan materi presentasi, mengoperasikan komputer acara, dan menayangkan konten pada videotron atau proyektor.</p></div><div class="mini-stat" style="display:block"><strong style="font-size:13px">Kameramen</strong><p class="small muted" style="margin-top:6px">Merekam MC, pemateri, peserta, serta seluruh momen penting. Jika diperlukan dua orang, gunakan Kameramen 1 dan Kameramen 2.</p></div><div class="mini-stat" style="display:block"><strong style="font-size:13px">Dokumentasi</strong><p class="small muted" style="margin-top:6px">Mengambil foto pembukaan, pemateri, peserta, interaksi, foto bersama, dan momen penting kegiatan.</p></div></div></div><div class="toolbar"><div class="search">${icon('search')}<input class="input" placeholder="Cari nama, NIM, atau peran..." value="${esc(query)}" oninput="query=this.value;render();document.querySelector('.search input')?.focus()"></div></div><div class="grid staff-grid">${list.length?list.map(p=>{let count=new Set(db.assignments.filter(a=>a.staffId===p.id).map(a=>a.eventId)).size;return `<div class="card staff-card"><div class="staff-top"><div class="avatar">${esc(initials(p.name))}</div><div style="min-width:0"><h3>${esc(p.name)}</h3><p>${esc(     function honorPage(){let rows=[];for(let e of db.events){let ids=[...new Set(evAssignments(e.id).map(a=>a.staffId))];for(let id of ids){let total=due(e.id,id),received=paid(e.id,id);rows.push({e,p:staff(id),total,received,id})}}let total=rows.reduce((n,x)=>n+x.total,0),received=rows.reduce((n,x)=>n+x.received,0);return `${header('ADMINISTRASI INTERNAL','Honor petugas','Rincian hak, pembayaran, dan sisa honor tiap petugas.',`<button class="btn primary" onclick="openPaymentForm()">${icon('plus')} Catat pembayaran</button>`)}<div class="grid kpi-grid" style="grid-template-columns:repeat(3,1fr)"><div class="card kpi"><div class="kpi-icon">${icon('money')}</div><strong style="font-size:22px">${money(total)}</strong><span>Total honor</span></div><div class="card kpi"><div class="kpi-icon">${icon('check')}</div><strong style="font-size:22px">${money(received)}</strong><span>Sudah dibayar</span></div><div class="card kpi"><div class="kpi-icon">${icon('clock')}</div><strong style="font-size:22px">${money(total-received)}</strong><span>Sisa pembayaran</span></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>Petugas</th><th>Acara</th><th>Total honor</th><th>Dibayarkan</th><th>Sisa</th><th>Status</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr data-open onclick="goto('events','${x.e.id}');tab='honor';render()"><td>${esc(x.p?.name||'—')}</td><td>${esc(x.e.title)}</td><td>${money(x.total)}</td><td>${money(x.received)}</td><td>${money(Math.max(0,x.total-x.received))}</td><td>${badge(payStatus(x.total,x.received),x.received>=x.total?'paid':x.received?'partial':'missing')}</td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">Belum ada penugasan dengan honor.</div></td></tr>`}</tbody></table></div>`}
    function reportsPage(){let x=[...db.events].sort((a,b)=>b.startDate.localeCompare(a.startDate));return `${header('DOKUMEN & HASIL','Laporan & Arsip','Periksa hasil acara dan buka seluruh berkas dari satu daftar.')}<div class="card table-wrap"><table class="table"><thead><tr><th>Acara</th><th>Pengajuan</th><th>Foto</th><th>Rekaman</th><th>Laporan</th><th></th></tr></thead><tbody>${x.map(e=>`<tr><td>${esc(e.title)}<span class="sub">${esc(fmt(e.startDate))}</span></td><td>${e.applicationLink?'Tersedia':'—'}</td><td>${e.photo?(e.photoUrl?'Tersedia':'Menunggu'):'—'}</td><td>${!e.live||e.archiveStream?(e.recordUrl?'Tersedia':'Menunggu'):'—'}</td><td>${badge(e.reportStatus==='final'?'Final':e.reportStatus==='draft'?'Draf':'Belum dibuat',e.reportStatus)}</td><td><button class="link-btn" onclick="goto('events','${e.id}');tab='report';render()">Buka →</button></td></tr>`).join('')}</tbody></table></div>`}
    function settingsPage(){let s=db.settings||{};return `${header('KONFIGURASI','Pengaturan','Folder induk Google Drive, identitas laporan, dan akun petugas.') }<div class="grid two-col"><div class="card pad"><div class="card-head"><div><h2>Folder & laporan</h2><p>Folder hasil acara dibuat di bawah lokasi ini.</p></div></div><form onsubmit="saveSettings(event)" class="form-grid"><div class="field full"><label>Folder induk foto (ID atau URL)</label><input class="input" name="photoParentId" value="${esc(s.photoParentId||'')}"></div><div class="field full"><label>Folder induk rekaman (ID atau URL)</label><input class="input" name="recordParentId" value="${esc(s.recordParentId||'')}"></div><div class="field full"><label>Folder induk arsip berkas</label><input class="input" name="archiveParentId" value="${esc(s.archiveParentId||'')}"></div><div class="field"><label>Nama tim / unit</label><input class="input" name="organization" value="${esc(s.organization||'')}"></div><div class="field"><label>Judul laporan</label><input class="input" name="reportHeader" value="${esc(s.reportHeader||'')}"></div><div class="field full"><button class="btn primary" style="width:max-content" ${userRole!=='admin'?'disabled':''}>Simpan pengaturan</button></div></form></div><div class="card pad"><h2>Alur kerja</h2><p class="muted" style="margin:11px 0">Pengajuan → Jadwal & penugasan → Pelaksanaan → Dokumentasi → Laporan → Honor.</p><div class="warning">${LOCAL?'Ini adalah pratinjau dengan data contoh. Pasang paket Apps Script untuk menyimpan data bersama di Google Sheets dan membuat folder Google Drive.':'Setiap folder dapat dibagikan kepada panitia saat hasilnya siap.'}</div><p class="small muted">Gunakan akun pengelola Drive yang memiliki izin menulis di kedua folder induk. Honor hanya dicatat dan diubah oleh administrator.</p></div></div>${userRole==='admin'?`<div class="card pad" style="margin-top:20px"><div class="card-head"><div><h2>Akun internal</h2><p>Berikan login untuk petugas. Kata     function detail(e){let ss=evSessions(e.id),as=evAssignments(e.id),people=[...new Set(as.map(a=>a.staffId))],paidCount=people.filter(id=>paid(e.id,id)>=due(e.id,id)&&due(e.id,id)>0).length,labels=[['overview','Ringkasan'],['schedule','Jadwal & lokasi'],['team','Penugasan'],['docs','Dokumentasi & arsip'],['report','Laporan hasil'],['honor','Honor']];return `<div class="page-head" style="align-items:center"><div><button class="btn ghost sm" style="padding-left:0;color:var(--accent);margin-bottom:12px" onclick="goto('events')">${icon('back')} Kembali ke daftar</button><div class="detail-title"><div class="datebox"><strong>${esc(e.startDate?.slice(8)||'—')}</strong><span>${esc(month(e.startDate))}</span></div><div><h1>${esc(e.title)}</h1><p>${esc(e.organizer)} · ${esc(dateLabel(e))}</p></div></div></div><div class="btnrow">${badge(statuses[e.status],e.status==='done'?'complete':e.status)}<button class="btn" onclick="openEventForm('${e.id}')">Edit acara</button>${userRole==='admin'?`<button class="btn danger" onclick="removeRecord('events','${e.id}')">Hapus acara</button>`:''}<button class="btn primary" onclick="tab='report';render()">${icon('file')} Laporan</button></div></div><div class="tabs">${labels.map(([k,l])=>`<button class="tab ${tab===k?'active':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>${{overview:overviewDetail,schedule:scheduleDetail,team:teamDetail,docs:docsDetail,report:reportDetail,honor:honorDetail}[tab](e,ss,as,people,paidCount)}`}
    function overviewDetail(e,ss,as,people,paidCount){return `<div class="detail-layout"><div class="grid" style="align-content:start"><div class="card pad"><div class="card-head"><h2>Informasi acara</h2><button class="link-btn" onclick="openEventForm('${e.id}')">Ubah data</button></div><div class="info-grid"><div><div class="info-label">Waktu pelaksanaan</div><div class="info-value">${esc(dateLabel(e))}</div></div><div><div class="info-label">Format</div><div class="info-value">${esc(formats[e.format]||'—')}</div></div><div><div class="info-label">Penyelenggara</div><div class="info-value">${esc(e.organizer)}</div></div><div><div class="info-label">PIC panitia</div><div class="info-value">${esc(e.pic)}${e.picRole?` · ${esc(e.picRole)}`:''}</div></div><div><div class="info-label">Kontak PIC</div><div class="info-value">${esc(e.phone||'—')}</div>${e.phone?`<div class="btnrow" style="margin-top:7px"><a class="btn sm soft" target="_blank" rel="noopener" href="https://wa.me/${phone(e.phone)}">WhatsApp</a><a class="btn sm" href="tel:${phone(e.phone)}">Telepon</a></div>`:''}</div><div><div class="info-label">Layanan</div><div class="info-value">${esc(serviceText(e))}</div></div></div>${e.notes?`<div style="margin-top:20px"><div class="info-label">Catatan kebutuhan</div><p class="small">${esc(e.notes)}</p></div>`:''}</div><div class="card pad"><div class="card-head"><h2>Sesi & tim</h2><button class="link-btn" onclick="tab='schedule';render()">Lihat jadwal →</button></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="mini-stat"><span class="muted small">Sesi</span><strong>${ss.length}</strong></div><div class="mini-stat"><span class="muted small">Petugas</span><strong>${people.length}</strong></div></div><p class="small muted" style="margin-top:15px">${ss.map(s=>`${esc(s.title)} (${esc(fmt(s.date))})`).join(' · ')||'Tambahkan sesi agar penugasan dan penggunaan lokasi terlihat jelas.'}</p></div></div><div class="detail-side"><div class="card pad"><h2>Pr     function sessionConflict(s){let aTime=new Date(`${s.date}T${s.start||'00:00'}`),bTime=new Date(`${s.date}T${s.end||'00:00'}`);if(bTime<=aTime)bTime.setDate(bTime.getDate()+1);return db.sessions.filter(o=>o.id!==s.id&&o.eventId!==s.eventId).flatMap(o=>{let x=new Date(`${o.date}T${o.start||'00:00'}`),y=new Date(`${o.date}T${o.end||'00:00'}`);if(y<=x)y.setDate(y.getDate()+1);if(!(aTime<y&&x<bTime))return [];let same=(s.venues||'').split(',').map(z=>z.trim().toLowerCase()).filter(Boolean).filter(z=>(o.venues||'').split(',').map(v=>v.trim().toLowerCase()).includes(z));let first=evAssignments(s.eventId).filter(v=>v.sessionId===s.id).map(v=>v.staffId),second=evAssignments(o.eventId).filter(v=>v.sessionId===o.id).map(v=>v.staffId),staffOverlap=first.filter(v=>second.includes(v)).map(v=>staff(v)?.name).filter(Boolean);return [...same.map(z=>`Lokasi ${z} juga dipakai pada ${event(o.eventId)?.title}`),...staffOverlap.map(z=>`${z} juga bertugas pada ${event(o.eventId)?.title}`)]})}
    function scheduleDetail(e,ss){return `<div class="detail-layout"><div class="card pad"><div class="card-head"><div><h2>Jadwal per sesi</h2><p>Jam selesai lebih awal dari jam mulai dianggap melewati tengah malam.</p></div><button class="btn sm primary" onclick="openSessionForm('${e.id}')">${icon('plus')} Tambah sesi</button></div>${ss.length?ss.map(s=>`<div class="session-card"><div class="session-head"><div><h3>${esc(s.title)}</h3><p>${esc(dayFmt(s.date))} · ${esc(s.start)}–${esc(s.end)}${s.end<=s.start?' (+1 hari)':''}</p></div><div class="btnrow"><button class="link-btn" onclick="openSessionForm('${e.id}','${s.id}')">Edit</button><button class="link-btn" style="color:var(--red)" onclick="removeRecord('sessions','${s.id}')">Hapus</button></div></div><div class="session-details">${s.venues?`<span>⌖ ${esc(s.venues)}</span>`:''}${s.area?`<span>${esc(s.area)} · ${esc(s.venueType||'')}</span>`:''}${s.format!=='offline'?`<span>Zoom ${esc(s.meetingId||'')}</span>`:''}<span>${evAssignments(e.id).filter(a=>a.sessionId===s.id).length} petugas</span></div>${s.address?`<p class="small muted" style="margin-top:8px">${esc(s.address)}</p>`:''}${s.zoomLink?`<a class="small" target="_blank" rel="noopener" style="color:var(--accent)" href="${esc(url(s.zoomLink))}">Buka Zoom ↗</a>`:''}${sessionConflict(s).map(w=>`<div class="warning">${icon('alert')} ${esc(w)}</div>`).join('')}</div>`).join(''):`<div class="empty">Belum ada sesi. Tambahkan hari atau sesi kegiatan untuk mengatur tempat dan petugas.</div>`}</div><div class="detail-side"><div class="card pad"><h2>Ringkasan lokasi</h2><p class="muted small" style="margin-top:8px">${esc([...new Set(ss.flatMap(s=>(s.venues||'').split(',').map(x=>x.trim()).filter(Boolean)))].join(', ')||'Belum ada lokasi fisik.')}</p><div class="warning" style="margin-top:16px">Satu sesi dapat mencakup beberapa ruangan atau area, dipisahkan dengan koma.</div></div></div></div>`}
    function teamDetail(e,ss,as){return `<div class="card pad"><div class="card-head"><div><h2>Penugasan petugas</h2><p>Peran dan lokasi dapat dibedakan pada setiap sesi.</p></div><button class="btn sm primary" onclick="openAssignmentForm('${e.id}')" ${!ss.length||!db.staff.length?'disabled':''}>${icon('plus')} Tambah tugas</button></div>${!ss.length||!db.staff.length?'<div class="warning">Tambahkan sesi dan petugas terlebih dahulu.</div>':''}<div class="table-wrap"><table class="table"><thead><tr><th>Petugas</th><th>Peran</th><th>Sesi</th><th>Tempat</th><th>Honor</th><th></th></tr></thead><tbody>${as.length?as.map(a=>{let s=ss.find(v=>v.id===a.sessionId);return `<tr><td>${esc(staff(a.staffId)?.name||'—')}</td><td>${esc(a.role)}</td><td>${esc(s?.title||'—')}<span class="sub">${esc(fmt(s?.date))}</span></td><td>${esc(a.venue||'—')}</td><td>${money(a.honor)}</td><td class="actions"><button onclick="openAssignmentForm('${e.id}','${a.id}')">Edit</button><button class="red" onclick="removeRecord('assignments','${a.id}')">Hapus</button></td></tr>`}).join(''):`<tr><td colspan="6"><div class="empty">Belum ada penugasan.</div></td></tr>`}</tbody></table></div></div>`}
    function docsDetail(e){let files=db.files.filter(f=>f.eventId===e.id);let kinds=[['photo','Foto',e.photo,e.photoUrl],['record','Recording',!e.live||e.archiveStream,e.recordUrl]];return `<div class="detail-layout"><div class="grid" style="align-content:start"><div class="card pad"><div class="card-head"><div><h2>Folder dokumentasi</h2><p>QR laporan selalu menuju folder acara, bukan folder induk.</p></div></div>${kinds.filter(x=>x[2]).map(([kind,label,_,link])=>`<div class="session-card"><div class="session-head"><div><h3>${icon(kind==='photo'?'camera':'video')} ${label}</h3><p>${link?'Folder acara sudah tersimpan':'Belum ada folder acara'}</p></div><div class="btnrow">${link?`<a href="${esc(url(link))}" target="_blank" rel="noopener" class="btn sm">Buka folder ${icon('external')}</a>`:`<button class="btn sm soft" onclick="createFolder('${e.id}','${kind}')">Buat folder</button>`}</div></div>${link?`<p class="small muted" style="overflow-wrap:anywhere;margin-top:9px">${esc(link)}</p><button class="link-btn" onclick="shareFolder('${e.id}','${kind}')">Aktifkan akses tautan panitia</button>`:''}</div>`).join('')||'<div class="empty">Layanan dokumentasi tidak digunakan.</div>'}<button class="btn sm" onclick="openLinkForm('${e.id}')">${icon('link')} Tambahkan / ubah tautan</button></div><div class="card pad"><div class="card-head"><div><h2>Arsip berkas</h2><p>Pengajuan, hasil scan, dan berkas pendukung.</p></div><button class="btn sm" onclick="openFileForm('${e.id}')">${icon('plus')} Tambah berkas</button></div>${e.applicationLink?`<div class="progress-row"><span>Surat pengajuan</span><a class="link-btn" href="${esc(url(e.applicationLink))}" target="_blank" rel="noopener">Buka ↗</a></div>`:''}${e.scanUrl?`<div class="progress-row"><span>Scan laporan final</span><a class="link-btn" href="${esc(url(e.scanUrl))}" target="_blank" rel="noopener">Buka ↗</a></div>`:''}${files.map(f=>`<div class="progress-row"><span>${esc(f.label||f.name)}</span><div class="btnrow"><a class="li     function renumberAssignmentRows(){document.querySelectorAll('#assignment-rows .assignment-number').forEach((el,i)=>el.textContent=i+1)}
    function addAssignmentRow(){let form=document.getElementById('modal-form'),root=document.getElementById('assignment-rows');if(!form||!root)return;root.insertAdjacentHTML('beforeend',assignmentRowMarkup(form.dataset.eventId));renumberAssignmentRows();root.lastElementChild?.scrollIntoView({behavior:'smooth',block:'nearest'})}
    function removeAssignmentRow(button){let rows=document.querySelectorAll('#assignment-rows .assignment-row');if(rows.length<=1)return notify('Minimal satu petugas harus dipilih.');button.closest('.assignment-row')?.remove();renumberAssignmentRows()}
    function hasAssignmentConflict(record,pool=db.assignments){let sess=db.sessions.find(s=>s.id===record.sessionId);return pool.filter(a=>a.staffId===record.staffId&&a.id!==record.id).some(a=>{let other=db.sessions.find(s=>s.id===a.sessionId);if(!sess||!other)return false;let x=new Date(`${sess.date}T${sess.start}`),y=new Date(`${sess.date}T${sess.end}`),u=new Date(`${other.date}T${other.start}`),w=new Date(`${other.date}T${other.end}`);if(y<=x)y.setDate(y.getDate()+1);if(w<=u)w.setDate(w.getDate()+1);return x<w&&u<y})}
    function openAssignmentForm(eventId,id){let ss=evSessions(eventId);if(!ss.length||!db.staff.length)return notify('Tambahkan sesi dan petugas terlebih dahulu.');if(id){let a=db.assignments.find(x=>x.id===id),first=ss.find(x=>x.id===a?.sessionId)||ss[0];modal('Edit penugasan',`<div class="form-grid">${select('Petugas','staffId',db.staff.map(p=>[p.id,`${p.name}${p.nim?` · ${p.nim}`:''}`]),a.staffId)}${select('Peran / posisi','role',roles.map(r=>[r,r]),a.role||'Operator')}${select('Sesi','sessionId',ss.map(s=>[s.id,`${s.title} · ${fmt(s.date)}`]),a.sessionId||first?.id)}${field('Ruangan / area tugas','venue',a.venue||first?.venues?.split(',')[0]?.trim())}${field('Honor untuk tugas ini (Rp)','honor',a.honor,'number',false,'min="0" step="1000"')}${textArea('Catatan penugasan','note',a.note)}<div class="field full"><span class="hint">Gunakan Kameramen 1 dan Kameramen 2 jika dua orang membagi sudut pengambilan gambar.</span></div></div>`,'saveAssignment');let form=document.getElementById('modal-form');form.dataset.id=id;form.dataset.eventId=eventId;return}assignmentRowCounter=0;modal('Tambah beberapa petugas',`<div class="assignment-builder" id="assignment-rows">${assignmentRowMarkup(eventId)}</div><div class="btnrow" style="margin-top:14px"><button class="btn soft" type="button" onclick="addAssignmentRow()">${icon('plus')} Tambah petugas lain</button></div><div class="warning" style="margin-top:15px">Satu acara dapat memiliki banyak petugas. Pilih peran Kameramen 1 dan Kameramen 2 jika membutuhkan dua kameramen.</div>`,'saveAssignments','Simpan semua penugasan');let form=document.getElementById('modal-form');form.dataset.eventId=eventId;renumberAssignmentRows()}
    async function saveAssignments(ev){ev.preventDefault();let eventId=ev.target.dataset.eventId,rows=[...ev.target.querySelectorAll('.assignment-row')],read=(row,name)=>row.querySelector(`[data-field="${name}"]`)?.value||'',records=rows.map(row=>({id:uid(),eventId,staffId:read(row,'staffId'),role:read(row,'role'),sessionId:read(row,'sessionId'),venue:read(row,'venue'),honor:Math.max(0,Number(read(row,'honor'))||0),note:read(row,'note')}));if(records.some(r=>!r.staffId||!r.sessionId||!r.role))return notify('Lengkapi petugas, peran, dan sesi pada setiap baris.');let pool=[...db.assignments],conflicts=0;records.forEach(r=>{if(hasAssignmentConflict(r,pool))conflicts++;pool.push(r)});if(!confirm(`Tambahkan ${records.length} penugasan ke acara ini?${conflicts?`\n\nTerdapat ${conflicts} potensi bentrok jadwal yang perlu diperiksa.`:''}`))return;if(busy)return;busy=true;let saved=0;try{for(let record of records){let r=await api('save',{table:'assignments',record});if(r.data)db=r.data;saved++}closeModal();tab='team';render();notify(`${saved} penugasan berhasil ditambahkan${conflicts?' · periksa potensi bentrok jadwal':''}`)}catch(e){if(saved){closeModal();tab='team';render()}notify(saved?`${saved} penugasan tersimpan, sisanya gagal: ${e.message}`:(e.message||'Gagal menyimpan penugasan.'))}finally{busy=false}}
    async function saveAssignment(ev){ev.preventDefault();let v=values(ev),eventId=ev.target.dataset.eventId,old=db.assignments.find(x=>x.id===ev.target.dataset.id)||{},record={...old,...v,id:old.id||uid(),eventId,honor:Math.max(0,Number(v.honor)||0)},conflicts=hasAssignmentConflict(record);try{await mutate('save',{table:'assignments',record},conflicts?'Tugas tersimpan. Periksa bentrok jadwal petugas.':'Penugasan tersimpan');tab='team';render()}catch{}}
    function openPaymentForm(eventId){if(userRole!=='admin')return notify('Pencatatan pembayaran hanya untuk administrator.');let options=(eventId?[event(eventId)]:db.events).flatMap(e=>[...new Set(evAssignments(e.id).map(a=>a.staffId))].map(id=>[`${e.id}|${id}`,`${e.title} · ${staff(id)?.name}`]));if(!options.length)return notify('Buat penugasan petugas terlebih dahulu.');modal('Catat pembayaran',`<div class="form-grid">${select('Acara & petugas','target',options,options[0][0])}${field('Tanggal bayar *','date',today(),'date',false,'required')}${field('Nominal (Rp) *','amount','','number',false,'required min="1" step="1"')}${field('URL bukti pembayaran','proofUrl','','url',true)}${textArea('Catatan','note')}</div>`,'savePayment')}
    async function savePayment(ev){ev.preventDefault();let v=values(ev),[eventId,staffId]=v.target.split('|'),n=Number(v.amount),remaining=due(eventId,staffId)-paid(eventId,staffId);if(n<=0||n>remaining)return notify(`Nominal harus lebih dari 0 dan maksimal ${money(Math.max(0,remaining))}.`);if(v.proofUrl&&!url(v.proofUrl))return notify('URL bukti harus diawali https://');let record={id:uid(),eventId,staffId,date:v.date,amount:n,proofUrl:v.proofUrl,note:v.note};if(!confirm(`Catat pembayaran ${money(n)} untuk ${staff(staffId)?.name||'petugas ini'}?`))return;try{await mutate('save',{table:'payments',record},'Pembayaran dicatat');if(selected){tab='honor';render()}}catch{}}
    function openLinkForm(eventId){let e=event(eventId);modal('Tautan hasil & scan',`<div class="form-grid">${field('Folder foto acara','photoUrl',e.photoUrl,'url',true)}${field('Folder rekaman acara','recordUrl',e.recordUrl,'url',true)}${field('Scan laporan final','scanUrl',e.scanUrl,'url',true)}${field('Berkas pengajuan','applicationLink',e.applicationLink,'url',true)}</div>`,'saveLinks');document.getElementById('modal-form').dataset.eventId=eventId}
    async function saveLinks(ev){ev.preventDefault();let e=event(ev.target.dataset.eventId),v=values(ev);if(Object.values(v).some(x=>x&&!url(x)))return notify('Semua tautan harus diawali https://');try{await mutate('save',{table:'events',record:{...e,...v}},'Tautan tersimpan');tab='docs';render()}catch{}}
    function openStatusForm(id){let e=event(id);modal('Status dokumentasi',`<div class="form-grid">${select('Dokumentasi foto','photoStatus',[['unused','Tidak digunakan'],['missing','Belum lengkap'],['complete','Lengkap']],e.photoStatus)}${select('Recording','recordStatus',[['missing','Belum tersedia'],['available','Tersedia']],e.recordStatus)}</div>`,'saveStatus');document.getElementById('modal-form').dataset.id=id}
    async function saveStatus(ev){ev.preventDefault();let e=event(ev.target.dataset.id),v=values(ev);try{await mutate('save',{table:'events',record:{...e,...v}},'Status dokumentasi diperbarui');tab='docs';render()}catch{}}
    function openReportForm(id){let e=event(id);modal('Hasil pelaksanaan',`<div class="form-grid">${textArea('Ringkasan hasil kegiatan *','result',e.result)}${select('Status laporan','reportStatus',[['none','Belum dibuat'],['draft','Draf'],['final','Final']],e.reportStatus)}<div class="warning" style="grid-column:1/-1">Laporan untuk panitia tidak memuat informasi honor. QR hanya ditampilkan untuk folder hasil yang tautannya tersedia.</div></div>`,'saveReport');document.getElementById('modal-form').dataset.id=id}
    async function saveReport(ev){ev.preventDefault();let e=event(ev.target.dataset.id),v=values(ev);if(v.reportStatus==='final'&&!v.result.trim())return notify('Isi hasil kegiatan sebelum laporan difinalkan.');try{await mutate('save',{table:'events',record:{...e,...v}},'Laporan diperbarui');tab='report';render()}catch{}}
    function openFileForm(eventId){modal('Tambah berkas arsip',`<div class="form-grid">${field('Nama / keterangan berkas *','label','','text',true,'required')}${field('Tautan berkas Drive / lainnya','url','','url',true)}<div class="field full"><label>Atau unggah berkas (maksimum 8 MB)</label><input class="input" type="file" name="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"></div><p class="small muted" style="grid-column:1/-1">Berkas yang diunggah tersimpan di folder arsip. Pada pratinjau, gunakan tautan.</p></div>`,'saveFile');document.getElementById('modal-form').dataset.eventId=eventId}
    async function saveFile(ev){ev.preventDefault();let v=values(ev),file=ev.target.elements.file.files[0],eventId=ev.target.dataset.eventId;if(!v.url&&!file)return notify('Masukkan tautan atau pilih berkas.');if(v.url&&!url(v.url))return notify('Tautan harus diawali https://');if(file&&LOCAL)return notify('Unggah berkas aktif setelah pemasangan Google Apps Script.');if(!confirm(`Tambahkan berkas "${v.label}" ke arsip acara?`))return;try{if(file){if(file.size>8*1024*1024)return notify('Maksimum ukuran berkas 8 MB.');let data=await new Promise((res,rej)=>{let reader=new FileReader();reader.onload=()=>res(String(reader.result).split(',')[1]);reader.onerror=rej;reader.readAsDataURL(file)});let r=await mutate('uploadFile',{eventId,label:v.label,name:file.name,mime:file.type||'application/octet-stream',data},'Berkas berhasil diunggah');if(r?.data)db=r.data}else await mutate('save',{table:'files',record:{id:uid(),eventId,label:v.label,name:v.label,url:v.url}},'Berkas ditambahkan');tab='docs';render()}catch{}}
    async function saveSettings(ev){ev.preventDefault();let v=values(ev);try{await mutate('save',{table:'settings',record:v},'Pengaturan tersimpan')}catch{}}
    async function createFolder(eventId,kind){if(!confirm(`Buat folder ${kind==='photo'?'foto':'rekaman'} baru untuk acara ini?`))return;try{await mutate('createFolder',{eventId,kind},'Folder acara berhasil dibuat');tab='docs';render()}catch{}}
    async function shareFolder(eventId,kind){if(!confirm('Aktifkan akses baca untuk siapa saja yang memiliki tautan folder ini? Pastikan memang boleh dibagikan kepada panitia.'))return;try{await mutate('shareFolder',{eventId,kind},'Akses folder diaktifkan')}catch{}}
    async function removeRecord(table,id){let message={events:'Hapus acara beserta seluruh sesi, penugasan, pembayaran, dan catatan berkasnya?',sessions:'Hapus sesi beserta seluruh penugasan di dalamnya?',staff:'Hapus petugas ini dari daftar?',assignments:'Hapus penugasan petugas ini?',payments:'Hapus catatan pembayaran ini?',files:'Hapus catatan berkas ini? Berkas asli di Google Drive tidak ikut terhapus.',users:'Hapus akun internal ini? Pengguna tersebut tidak akan bisa login kembali.'}[table]||'Hapus data ini?';if(!confirm(`${message}\n\nTindakan ini tidak dapat dibatalkan.`))return;try{await mutate('remove',{table,id},'Data berhasil dihapus');if(table==='events')goto('events')}catch{}}
    function renderLogin(error=''){document.getElementById('root').innerHTML=`<div class="login-screen"><form class="card login-box" onsubmit="doLogin(event)"><div class="brandmark">${icon('calendar')}</div><div class="eyebrow">PORTAL INTERNAL</div><h1>Selamat datang di ruang acara.</h1><p>Masuk untuk mengelola kegiatan, tim, dan dokumentasi.</p>${error?`<div class="warning">${esc(error)}</div>`:''}<div class="field"><label>Email petugas</label><input class="input" type="email" name="email" autocomplete="username" required></div><div class="field"><label>Kata sandi</label><input class="input" type="password" name="password" autocomplete="current-password" required></div><button class="btn primary">Masuk ke dashboard ${icon('arrow')}</button></form></div>`}
    async function doLogin(ev){ev.preventDefault();let v=values(ev);try{let r=await api('login',v);sessionToken=r.token;localStorage.setItem('ra-token',sessionToken);await load()}catch(e){renderLogin(e.message)}}
    async function logout(){try{await api('logout')}catch{}sessionToken='';localStorage.removeItem('ra-token');renderLogin()}
    if(LOCAL)load();else if(sessionToken)load();else renderLogin();
  </script>
</body>
</html>
